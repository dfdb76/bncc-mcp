[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bncc-mcp"
version = "0.1.0"
description = "Servidor MCP da BNCC: habilidades com unidade temática, objeto de conhecimento e o Mapa de Foco (Instituto Reúna)."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Daniel" }]
keywords = ["bncc", "mcp", "educacao", "curriculo", "brasil", "mapa-de-foco"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Education",
]
dependencies = ["mcp>=1.2.0"]

[project.urls]
Homepage = "https://github.com/dfdb76/bncc-mcp"
Repository = "https://github.com/dfdb76/bncc-mcp"

[project.scripts]
bncc-mcp = "bncc_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["bncc_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"bncc_mcp/data" = "bncc_mcp/data"
